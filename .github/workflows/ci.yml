name: CI
on: [push]
permissions:
  contents: read
  # theme-check-action reports results as a check run, which needs write access.
  checks: write
jobs:
  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Theme Check
        uses: shopify/theme-check-action@v2
        with:
          token: ${{ github.token }}
