name: CI
on: [push]
permissions:
  contents: read
jobs:
  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Run the pinned CLI directly. shopify/theme-check-action@v2 installs the latest CLI and
      # crashes on its object-shaped JSON output ("e.filter is not a function").
      - name: Theme Check
        run: npx --yes @shopify/cli@5.0.1 theme check --fail-level error
  loadout-parity:
    # The storefront builder's verdict (assets/loadout-verdict.js) must match the KOVA Core functions.
    name: Loadout rules parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/kova-core/package-lock.json
      - name: Install the loadout-merge workspace
        working-directory: apps/kova-core
        run: npm ci --workspace loadout-merge --include-workspace-root=false --ignore-scripts
      - name: Parity test
        working-directory: apps/kova-core/extensions/loadout-merge
        run: npx vitest run tests/theme-parity.test.js
